# This is the OpenAPI specification for your service. It is used to generate the client code.
# To generate the server code, use the Gradle task `openApiGenerate`. The 
# generated code will be placed in `build/generate-resources/main`.
#
# We will evaluate you based on how well you design your API.
# 1. How well it follows REST principles.
# 2. How easy it is to understand and use.
#
# References
# 1. https://swagger.io/specification/
openapi: "3.0.0"
info:
  version: 1.0.0
  title: User Service
  license:
    name: MIT
servers:
  - url: http://localhost
paths:
  /hello:
    get:
      summary: This is just a test endpoint to get you started.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Test return
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/HelloResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /estate:
    post:
      summary: Create a new estate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEstateRequest"
      responses:
        '201':
          description: Estate created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEstateResponse"
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /estate/{id}/tree:
    post:
      summary: Create a new tree in a given estate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTreeRequest"
      responses:
        '201':
          description: Tree created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTreeResponse"
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: Estate not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /estate/{id}/stats:
    get:
      summary: Get tree statistics for a given estate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tree statistics returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeStatsResponse"
        '404':
          description: Estate not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /estate/{id}/drone-plan:
    get:
      summary: Get total drone travel distance for a given estate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: max_distance
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Drone distance returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DronePlanResponse"
        '404':
          description: Estate not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HelloResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Hello, World!
    CreateEstateRequest:
      type: object
      required:
        - length
        - width
      properties:
        length:
          type: integer
          minimum: 1
          maximum: 50000
        width:
          type: integer
          minimum: 1
          maximum: 50000
    CreateEstateResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    CreateTreeRequest:
      type: object
      required:
        - x
        - y
        - height
      properties:
        x:
          type: integer
          minimum: 1
          maximum: 50000
        y:
          type: integer
          minimum: 1
          maximum: 50000
        height:
          type: integer
          minimum: 1
          maximum: 30
    CreateTreeResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    TreeStatsResponse:
      type: object
      required:
        - count
        - max
        - min
        - median
      properties:
        count:
          type: integer
          format: int64
        max:
          type: integer
          format: int64
        min:
          type: integer
          format: int64
        median:
          type: integer
          format: int64
    DronePlanResponse:
      type: object
      required:
        - distance
      properties:
        distance:
          type: integer
          format: int64
        rest:
          $ref: "#/components/schemas/DronePlanRest"
    DronePlanRest:
      type: object
      required:
        - x
        - y
      properties:
        x:
          type: integer
          format: int64
        y:
          type: integer
          format: int64
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
